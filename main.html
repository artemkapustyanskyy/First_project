<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="first-wrapper">
        <div class="container-logo">
          <p class="container-logo__text">
            <img
              class="container-logo__image"
              src="img/logo.png"
              alt="Logo"
            />Чіп Чендж
          </p>
        </div>
        <div class="container-menu">
          <p>Послуги</p>
          <p class="container-menu__blue">
            <a href="converter.html" target="_blank">Конвертер валют</a>
          </p>
          <p>Контакти</p>
          <p>Задати питання</p>
        </div>

        <div class="container-login">
          <p class="container-login__text">
            <img
              class="container-login__image"
              src="img/login.png"
              alt="Login"
            />Особистий кабінет
          </p>
        </div>
      </div>
    </header>
    <main>
      <div class="main-wrapper">
        <div class="main-container">
          <span class="main-container__title">Чіп Чендж</span>
          <p class="main-container__description">Обмінник валют - навчальний</p>
          <button class="main-container__button">
            <p class="main-container__button--text">Конвертер валют</p>
          </button>
        </div>
        <div class="main-container-image">
          <img src="img/card.png" alt="Card" />
        </div>
      </div>
    </main>
  </body>
</html>
